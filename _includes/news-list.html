<ul class="news-list">
  {% for n in include.items %}
  {% include news-href.html n=n %}
  <li{% if news_href %} class="has-post"{% endif %}>
    <time datetime="{{ n.date | date: '%Y-%m-%d' }}">{% if n.label %}{{ n.label }}{% else %}{{ n.date | date: '%b %Y' }}{% endif %}</time>
    <p>{% if n.icon %}<span class="news-icon" aria-hidden="true">{{ n.icon }}</span>{% endif %}<span>{{ n.text }}{% if news_href %} <a class="news-more" href="{{ news_href }}">{{ news_label }}<span class="sr-only"> about this news</span> →</a>{% endif %}</span></p>
  </li>
  {% endfor %}
</ul>

<svg viewBox="0 0 400 260" role="img" aria-label="Physics-informed neural network fitting industrial data" class="project-figure-svg">
  <rect width="400" height="260" fill="var(--figure-bg)"/>
  <g stroke="var(--figure-line)" stroke-width="1">
    {% for a in (0..2) %}{% for b in (0..3) %}<line x1="50" y1="{{ a | times: 50 | plus: 80 }}" x2="120" y2="{{ b | times: 40 | plus: 70 }}"/>{% endfor %}{% endfor %}
    {% for a in (0..3) %}{% for b in (0..3) %}<line x1="120" y1="{{ a | times: 40 | plus: 70 }}" x2="180" y2="{{ b | times: 40 | plus: 70 }}"/>{% endfor %}{% endfor %}
    {% for a in (0..3) %}<line x1="180" y1="{{ a | times: 40 | plus: 70 }}" x2="230" y2="130"/>{% endfor %}
  </g>
  <g fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5">
    {% for a in (0..2) %}<circle cx="50" cy="{{ a | times: 50 | plus: 80 }}" r="8"/>{% endfor %}
    {% for a in (0..3) %}<circle cx="120" cy="{{ a | times: 40 | plus: 70 }}" r="8"/><circle cx="180" cy="{{ a | times: 40 | plus: 70 }}" r="8"/>{% endfor %}
    <circle cx="230" cy="130" r="9" fill="var(--accent)"/>
  </g>
  <path d="M255 170 C 280 60, 305 60, 325 130 S 365 200, 385 90" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <g fill="var(--text-faint)">
    <circle cx="262" cy="140" r="3"/><circle cx="283" cy="96" r="3"/><circle cx="301" cy="88" r="3"/><circle cx="322" cy="124" r="3"/><circle cx="343" cy="170" r="3"/><circle cx="366" cy="150" r="3"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="var(--text-muted)">∂u/∂t + 𝒩[u] = 0</text>
  <text x="140" y="230" text-anchor="middle" font-size="11" fill="var(--text-faint)">data + physics loss</text>
</svg>

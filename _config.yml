title: Data & Language Intelligence Lab
short_title: DLI Lab
description: >-
  Data & Language Intelligence Lab at the School of Computer Science and Engineering,
  Kyungpook National University. We study generative language models, coding agents, and LLMs.
affiliation: School of Computer Science and Engineering, Kyungpook National University, Daegu, South Korea
email: sh0416{at}knu.ac.kr
github_org: https://github.com/knu-dli
lang: en

# For a project site (https://<user>.github.io/<repo>/) set baseurl to "/<repo>".
# For an organization/user site (https://<name>.github.io/) or a custom domain, leave it empty.
baseurl: ""
url: "https://dli.knu.ac.kr"

# Home page image shown to the right of the lab name. Replace the file (or this path) to change it.
hero_image: /assets/img/hero/hero.jpg
hero_image_alt: The lab's water-drop mascot surrounded by speech bubbles of code and text and a molecule-like network

markdown: kramdown
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Link-preview image (og:image / Twitter card) for every page
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg
twitter:
  card: summary_large_image

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

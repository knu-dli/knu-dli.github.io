- title: Code-Expert Language Models and Coding Agents for AI-Assisted Software Development
  title_ko: 인공지능 보조 소프트웨어 개발을 위한 코드 전문가 언어모델 및 코딩 에이전트 개발
  period: Mar. 2025 – Feb. 2030
  status: ongoing
  funding: Government-funded
  pi: Prof. Seonghyeon Lee
  description: >-
    Code-expert language models and coding agents that understand and operate over entire code
    repositories: repository-level code completion, context construction across multiple files,
    long-range dependency modeling in code, and agentic workflows in which models navigate large
    codebases, reason about project structure, and iteratively interact with tools.

